<div class="card form-card">
  <h2>{{ modoEdicion ? 'Editar curso' : 'Nuevo curso' }}</h2>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label for="nombre">Nombre del curso</label>
    <input id="nombre" type="text" formControlName="nombre" />

    <label for="codigo">Código</label>
    <input id="codigo" type="text" formControlName="codigo" />

    <label for="descripcion">Descripción</label>
    <input id="descripcion" type="text" formControlName="descripcion" />

    <label for="creditos">Créditos</label>
    <input id="creditos" type="number" formControlName="creditos" />

    <label for="cupoMaximo">Cupo máximo</label>
    <input id="cupoMaximo" type="number" formControlName="cupoMaximo" />

    <label class="checkbox-label">
      <input type="checkbox" formControlName="activo" />
      Curso activo
    </label>

    @if (errorMensaje) {
      <p class="error-text">{{ errorMensaje }}</p>
    }

    <div class="form-actions">
      <a class="btn btn-secondary" routerLink="/cursos">Cancelar</a>
      <button class="btn btn-primary" type="submit" [disabled]="guardando">
        {{ guardando ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </form>
</div>
