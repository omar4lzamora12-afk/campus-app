<div class="layout">
  <aside class="sidebar">
    <div class="brand">Campus App</div>

    <nav>
      <a routerLink="/dashboard" routerLinkActive="active">Panel principal</a>

      @if (puedeVerCursos) {
        <a routerLink="/cursos" routerLinkActive="active">Cursos</a>
      }

      @if (puedeVerUsuarios) {
        <a routerLink="/usuarios" routerLinkActive="active">Usuarios</a>
      }
    </nav>

    <div class="sidebar-footer">
      @if (usuario(); as u) {
        <div class="usuario-info">
          <span class="usuario-nombre">{{ u.nombre }}</span>
          <span class="badge" [ngClass]="'badge-' + u.rol">{{ u.rol }}</span>
        </div>
      }
      <button class="btn btn-secondary" (click)="cerrarSesion()">Cerrar sesión</button>
    </div>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
